name: Bridge tests

# The Atleta Racing app's unit tests (bridge/test-*.js) on every change to
# bridge/: Server CI skips bridge-only changes, and the Bridge build workflow
# only builds the installer. The tests need nothing installed. No secrets.

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Unit tests
        run: node --test "bridge/test-*.js"
